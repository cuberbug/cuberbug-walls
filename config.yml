# Директории
wallpapers_dir: "wallpapers"
previews_dir: ".previews"

# Список директорий внутри 'wallpapers_dir', которые нужно пропустить
exclude_dirs:
  - "artists"
  - "bucket"

# Поддерживаемые расширения изображений
allowed_extensions:
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".webp"

# Маркеры для определения блока для редактирования
opening_marker: "<!-- GENERATED: DO NOT EDIT -->"
closing_marker: "<!-- END GENERATED -->"

# Количество колонок таблицы
columns: 3

# Многострочный текст, который будет добавлен перед таблицей
header: |
  Эта таблица создана автоматически, все изображения в ней кликабельны и ведут на соответствующие файлы в репозитории.

# Многострочный текст, который будет добавлен после таблицы
footer: |
  Здесь находится хвостик автоматической генерации. Спасибо за просмотр! 👾